<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>原生菜单版清单</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#9aa3ab}a:hover{color:#e8ecef}
</style>
</helmet>
<div style="width: 520px; height: 560px; box-sizing: border-box; background: #c9ced6; font-family: -apple-system, 'PingFang SC', system-ui, sans-serif; color: #1d1d1f; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="height: 30px; background: rgba(246,246,246,0.92); display: flex; align-items: center; justify-content: flex-end; gap: 18px; padding: 0 14px; font-size: 13px; border-bottom: 1px solid rgba(0,0,0,0.08)">
<div style="display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 5px; background: rgba(0,0,0,0.12)">
<svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><rect x="4.6" y="4" width="3" height="10" rx="1.5"></rect><rect x="10.4" y="4" width="3" height="10" rx="1.5"></rect></svg>
<span style="font-weight: 600; font-variant-numeric: tabular-nums">3</span>
</div>
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2 6.5 A9 9 0 0 1 14 6.5"></path><path d="M4.4 9 A5.6 5.6 0 0 1 11.6 9"></path><circle cx="8" cy="12" r="1" fill="currentColor" stroke="none"></circle></svg>
<span style="font-variant-numeric: tabular-nums">周日 10:24</span>
</div>

<div style="position: absolute; top: 34px; right: 74px; width: 380px; box-sizing: border-box; padding: 5px; border-radius: 10px; background: rgba(240,240,242,0.96); box-shadow: 0 10px 30px rgba(0,0,0,0.22), 0 0 0 0.5px rgba(0,0,0,0.25); font-size: 13px; display: flex; flex-direction: column">
<div style="padding: 4px 10px 2px; font-size: 11px; font-weight: 600; color: #86868b">需要你</div>
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<div style="height: 24px; padding: 0 10px; border-radius: 5px; display: flex; align-items: center; gap: 8px; background: {{it.bg}}; color: {{it.fg}}">
<span style="width: 8px; height: 8px; border-radius: 50%; flex: none; background: {{it.dot}}"></span>
<span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.text}}</span>
<span style="flex: none; font-variant-numeric: tabular-nums; opacity: 0.6">{{it.wait}}</span>
</div>
</sc-for>
<div style="height: 1px; margin: 5px 10px; background: rgba(0,0,0,0.1)"></div>
<div style="height: 24px; padding: 0 10px; display: flex; align-items: center; justify-content: space-between">
<span>Friday 在做 1 件</span>
<svg width="8" height="10" viewBox="0 0 8 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 1.5 L6 5 L2 8.5"></path></svg>
</div>
<div style="height: 1px; margin: 5px 10px; background: rgba(0,0,0,0.1)"></div>
<div style="height: 24px; padding: 0 10px; display: flex; align-items: center; justify-content: space-between"><span>打开 Friday</span><span style="opacity: 0.5">⌘⇧Space</span></div>
<div style="height: 24px; padding: 0 10px; display: flex; align-items: center"><span>设置…</span></div>
<div style="height: 1px; margin: 5px 10px; background: rgba(0,0,0,0.1)"></div>
<div style="height: 24px; padding: 0 10px; display: flex; align-items: center; justify-content: space-between"><span>退出 Friday</span><span style="opacity: 0.5">⌘Q</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":560}}'>
class Component extends DCLogic {
renderVals() {
return {
items: [
{ dot: '#ff5f57', text: '终端在问 · 提现规则 tab 修复', wait: '3 分钟', bg: '#2f6fe4', fg: '#ffffff' },
{ dot: '#f5a623', text: '这轮做完了 · 导出中心列表分页', wait: '12 分钟', bg: 'transparent', fg: '#1d1d1f' },
{ dot: '#f5a623', text: '待你决定 · 合并 fix/withdrawal-rule-tabs', wait: '18 分钟', bg: 'transparent', fg: '#1d1d1f' }
]
};
}
}
</script>
</body>
</html>
